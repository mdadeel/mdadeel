name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python: ['3.10', '3.11', '3.12', '3.13']
        exclude:
          # Keep the matrix honest and cheap: full Python range on 22.04, newest on 24.04.
          - os: ubuntu-24.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.11'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install system dependencies
        # PyGObject is needed only if GTK is importable; the suite skips GUI tests
        # when it is not. Install the headers so the GUI-path tests can run.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgirepository1.0-dev gir1.2-gtk-3.0 python3-gi xvfb

      - name: Install package and test tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

  package:
    name: Build distributables
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

      # Note: ./packaging/build_appimage.sh and build_deb.sh are intentionally not
      # run here yet — they need a pinned AppImage/deb toolchain. Add them as a
      # separate job once the inputs are reproducible, rather than shipping a step
      # that may fail silently.
