name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arbor
          POSTGRES_PASSWORD: arbor
          POSTGRES_DB: arbor
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U arbor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://arbor:arbor@localhost:5432/arbor
      REDIS_URL: redis://localhost:6379
      # Non-secret placeholders so the build can validate its environment schema.
      NEXTAUTH_SECRET: ci-not-a-real-secret
      NEXTAUTH_URL: http://localhost:3000
      GITHUB_ID: ci-placeholder
      GITHUB_SECRET: ci-placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        # NOT blocking yet: the roadmap documents outstanding type diagnostics.
        # Remove continue-on-error once `npm run typecheck` is clean, then make the
        # workflow a required status check and enable the README badge.
        continue-on-error: true
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --run

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    # Remove continue-on-error once the build is verified green locally against a
    # generated Prisma client. Do not enable the README badge before then.
    continue-on-error: true

    env:
      DATABASE_URL: postgresql://arbor:arbor@localhost:5432/arbor
      REDIS_URL: redis://localhost:6379
      NEXTAUTH_SECRET: ci-not-a-real-secret
      NEXTAUTH_URL: http://localhost:3000
      GITHUB_ID: ci-placeholder
      GITHUB_SECRET: ci-placeholder

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
